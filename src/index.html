<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>

<body>
  <header>
    <h1>Weather App</h1>
  </header>
  <main>
    <form method="get">
      <input type="text" name="location" id="locationInput" placeholder="Location">
      <select name="unitGroup" id="unitGroupSelect">
        <option value="metric" selected>ºC</option>
        <option value="us">ºF</option>
      </select>
      <button type="submit">Get Weather</button>
    </form>

    <div id="weatherContainer">
      <div id="weatherSelector">
        <button>Current</button><button>Today</button><button>3 Days</button>
      </div>
      <div id="weatherDisplay">

        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Velit beatae fugit laudantium pariatur eaque
        reprehenderit sequi, minima, ipsum deleniti consequuntur unde harum nisi. Deserunt culpa rerum, iste quia natus
        quaerat!

      </div>
    </div>
  </main>
  <footer>
    <small>made by c8in4</small>
  </footer>

  <div class="theme-button" onclick="toggleTheme()">Switch Theme</div>
  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>

</html>
